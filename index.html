<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Les Boucles du Sablier — prototype v0.3</title>
    <!-- polices servies avec le jeu (assets/fonts/), avant les autres feuilles -->
    <link rel="stylesheet" href="src/shared/fonts.css" />
    <!-- une feuille par zone ; l'ordre est celui de l'ancien src/style.css (la cascade en dépend) -->
    <link rel="stylesheet" href="src/app/layout.css" />
    <link rel="stylesheet" href="src/shared/sprites.css" />
    <link rel="stylesheet" href="src/world/map.css" />
    <link rel="stylesheet" href="src/combat/scene.css" />
    <link rel="stylesheet" href="src/combat/scene-fx.css" />
    <link rel="stylesheet" href="src/app/panel.css" />
    <link rel="stylesheet" href="src/village/village.css" />
    <link rel="stylesheet" href="src/enemies/bestiary.css" />
    <link rel="stylesheet" href="src/modals/modal.css" />
    <link rel="stylesheet" href="src/shared/toast.css" />
    <link rel="stylesheet" href="src/mining/dig.css" />
    <link rel="stylesheet" href="src/world/explore-panel.css" />
    <link rel="stylesheet" href="src/intro/intro.css" />
    <link rel="stylesheet" href="src/lore/scene.css" />
    <link rel="stylesheet" href="src/hero/hero-panel.css" />
  </head>
  <body>
    <div class="app">
      <div class="top">
        <div class="title">
          Les Boucles du Sablier<small>prototype v0.3 — chemin, vrais combats, compétences, trophées, village</small>
        </div>
        <div class="res" id="res"></div>
        <div class="speed" id="speed"></div>
      </div>
      <div class="timer">
        <span class="lbl" id="loopLbl">⏳ BOUCLE 1</span>
        <div class="bar time"><i id="timeBar"></i></div>
        <span class="val" id="timeVal"></span>
      </div>
      <div class="main">
        <!-- héros toujours à gauche ; en étroit, le haut passe au-dessus des onglets et le bas en dessous -->
        <aside class="hero-col">
          <div class="card hero-box" id="heroTop"></div>
          <div class="card hero-box" id="heroMore"></div>
        </aside>
        <div class="card stage">
          <div class="tabs" id="tabs"></div>
          <!-- combat en diagonale : monstres en haut à droite, héros en bas à gauche -->
          <div class="view scene" id="sceneView" hidden>
            <div class="sc-head"><div class="sc-title" id="scTitle"></div></div>
            <div class="sc-enemies" id="scEnemies"></div>
            <div class="sc-bottom">
              <div class="unit hero" id="u-hero">
                <div class="por">
                  <img class="spr" src="assets/sprites/heros.png" alt="🧙" />
                </div>
                <div class="plate">
                  <div class="nm"><b id="heroLv">1</b> Héros</div>
                  <div class="bar hp"><i id="heroHpBar"></i><span id="heroHpTxt"></span></div>
                  <div class="swing"><i id="heroSwing"></i></div>
                  <div class="skills" id="scSkills"></div>
                </div>
              </div>
              <button class="retreat" id="retreatBtn">BATTRE EN RETRAITE</button>
            </div>
          </div>
          <div class="view mapview" id="mapView">
            <div class="mapwrap">
              <div class="map" id="map"></div>
              <div class="legend" id="legend"></div>
            </div>
            <div class="pane tilecard" id="tileCard"></div>
          </div>
          <div class="pane" id="pane" hidden></div>
        </div>
      </div>
      <div class="foot">
        <span
          >Clique une case pour voir sa fiche · double-clic sur une case dorée (ou déjà explorée) pour y aller
          directement.</span
        >
        <button id="resetBtn">Réinitialiser la sauvegarde</button>
      </div>
    </div>
    <div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
    <div class="toasts" id="toasts"></div>

    <script type="module" src="src/app/main.js"></script>
  </body>
</html>
