<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les Boucles du Sablier — prototype v0.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14161b; --panel:#1d2028; --panel2:#252935; --line:#323746;
  --text:#ebe8df; --muted:#9a9eab; --gold:#f0c04a; --gold-d:#a8842c;
  --hp:#6cc46a; --danger:#e3625b; --time:#7db3ea; --xp:#b48cf0;
  --pix:'Silkscreen',monospace; --body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px}
button{font-family:inherit;cursor:pointer}
.app{max-width:1200px;margin:0 auto;padding:14px 16px 30px}
/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.title{font-family:var(--pix);font-size:20px;letter-spacing:.5px;color:var(--gold);margin-right:auto;line-height:1.1}
.title small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);letter-spacing:0}
.res{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip span{color:var(--muted);font-weight:500;margin-left:3px}
.speed{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.speed button{background:var(--panel);color:var(--muted);border:0;padding:6px 10px;font-weight:700}
.speed button.on{background:var(--gold);color:#1a1a1a}
/* timer */
.timer{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.timer .lbl{font-family:var(--pix);font-size:12px;color:var(--time);white-space:nowrap}
.bar{position:relative;height:12px;background:#0e1014;border-radius:6px;overflow:hidden;flex:1}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.bar>span{position:absolute;inset:0;text-align:center;font-size:10px;font-weight:800;line-height:inherit;color:#fff !important;text-shadow:0 1px 2px #000;z-index:1}
.bar.time>i{background:linear-gradient(90deg,#4f86c4,var(--time))}
.bar.hp>i{background:var(--hp)} .bar.hp.enemy>i{background:var(--danger)}
.bar.xp>i{background:var(--xp)}
.bar.thin{height:7px}
.timer .val{font-variant-numeric:tabular-nums;font-weight:700;min-width:64px;text-align:right}
/* layout */
.main{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;align-items:start}
@media(max-width:940px){.main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.left{padding:10px 14px 14px}
.viewtabs{display:flex;gap:6px;margin-bottom:10px}
.viewtabs button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 12px;font-family:var(--pix);font-size:11px;position:relative}
.viewtabs button.on{color:#111;background:var(--gold);border-color:var(--gold)}
.vhp{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.vhp .bar{width:160px;height:14px;line-height:14px;flex:none}
.viewtabs .live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--danger);margin-left:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.view{height:620px}
.view[hidden]{display:none}
/* map */
.mapview{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;justify-content:center}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.map{display:grid;gap:4px;padding:12px;border:1px dashed #3a3f4d;border-radius:8px;background:
  radial-gradient(circle at 1px 1px,#2a2e39 1px,transparent 1.5px) 0 0/16px 16px}
.cell{width:60px;height:60px;position:relative}
.tile{position:absolute;inset:0;border-radius:6px;border:2px solid rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:27px;user-select:none;cursor:pointer;transition:filter .2s, transform .1s}
.tile:hover{transform:translateY(-1px)}
.tile.dim{filter:saturate(.3) brightness(.55)}
.tile.can{box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(240,192,74,.45);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--gold),0 0 4px rgba(240,192,74,.15)}}
.tile.sel{outline:3px solid #fff;outline-offset:2px}
.tile.locked{cursor:help}
.lv{position:absolute;top:-6px;right:-6px;background:#111;color:var(--gold);font-family:var(--pix);font-size:11px;line-height:1;padding:3px 4px 2px;border-radius:5px;border:1px solid #000}
.ck{position:absolute;left:3px;bottom:1px;font-size:12px;color:#123;font-weight:800}
.herom{position:absolute;right:-4px;bottom:-6px;font-size:18px;filter:drop-shadow(0 1px 1px #000)}
.bang{position:absolute;top:-9px;right:-9px;z-index:2;width:22px;height:22px;border-radius:50%;background:var(--danger);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;border:2px solid #111;animation:bounce 1s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-3px)}}
.bang[hidden]{display:none}
.tprog{position:absolute;left:3px;right:3px;bottom:3px;height:5px;background:rgba(0,0,0,.45);border-radius:3px;overflow:hidden}
.tprog i{display:block;height:100%;background:var(--gold)}
/* scene */
.scene{position:relative;border-radius:10px;border:1px solid #000;overflow:hidden;display:flex;flex-direction:column;padding:12px}
.sc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sc-title{background:rgba(10,11,15,.75);border-radius:8px;padding:8px 12px;min-width:240px}
.sc-title b{font-size:15px} .sc-title span{color:var(--muted)}
.sc-title .segs{margin:6px 0 0}
.sc-enemies{flex:1;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap;padding:10px}
.sc-msg{text-align:center;background:rgba(10,11,15,.7);border-radius:10px;padding:18px 26px;min-width:260px}
.sc-msg .big{font-size:54px;line-height:1.1}
.sc-msg .bar{margin-top:10px}
.sc-bottom{display:flex;flex-direction:column;align-items:center;gap:10px;padding-bottom:4px}
.unit{position:relative;width:132px;background:rgba(12,13,18,.85);border:1px solid #000;border-radius:9px;padding:8px 8px 7px;text-align:center;transition:opacity .5s, filter .5s}
.unit .por{font-size:46px;line-height:1.15;user-select:none}
.unit.elite{width:150px;border-color:#7a3a3a}.unit.elite .por{font-size:60px}
.unit.boss{width:190px;border-color:var(--gold-d)}.unit.boss .por{font-size:80px}
.unit .nm{font-size:12px;font-weight:700;display:flex;gap:5px;justify-content:center;align-items:center;white-space:nowrap}
.unit .nm b{background:#000;color:var(--gold);font-family:var(--pix);font-size:10px;padding:2px 4px;border-radius:3px}
.unit .bar{height:15px;margin-top:5px;line-height:15px;flex:none}
.swing{height:3px;background:#000;margin-top:4px;border-radius:2px;overflow:hidden}
.swing i{display:block;height:100%;background:#8d93a3}
.unit.dead{opacity:.12;filter:grayscale(1)}
.unit.hero{width:230px}
.unit.atk-d{animation:lungeD .25s}.unit.atk-u{animation:lungeU .25s}
@keyframes lungeD{50%{transform:translateY(16px)}} @keyframes lungeU{50%{transform:translateY(-16px)}}
.unit.shake{animation:shake .28s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.float{position:absolute;left:50%;top:18%;font-weight:800;font-size:19px;color:#fff;text-shadow:0 2px 3px #000;pointer-events:none;white-space:nowrap;animation:floatUp 1s ease-out forwards;z-index:3}
.float.f-crit{color:var(--gold);font-size:24px}.float.f-heal{color:var(--hp)}.float.f-miss{color:#c9c9c9;font-size:13px}.float.f-sk{color:#ffb3ef}.float.f-lv{color:var(--xp);font-family:var(--pix);font-size:14px}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-46px)}}
.skills{display:flex;gap:8px}
.skill{width:54px;height:54px;border:2px solid #000;border-radius:8px;background:#2c3140;position:relative;display:flex;align-items:center;justify-content:center;font-size:25px;overflow:hidden;cursor:help}
.skill .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.7) calc(var(--p)*1turn),transparent 0)}
.skill.ready{border-color:var(--gold)} .skill.lock{opacity:.4;font-size:18px}
.skill.fire{animation:fire .35s} @keyframes fire{50%{transform:scale(1.18)}}
.skill small{position:absolute;bottom:1px;right:3px;font-size:9px;font-weight:800;color:#fff;text-shadow:0 1px 1px #000}
.retreat{position:absolute;left:12px;bottom:12px;background:rgba(10,11,15,.8);border:2px solid var(--text);color:var(--text);border-radius:7px;padding:8px 12px;font-family:var(--pix);font-size:11px}
.retreat:hover:not(:disabled){background:var(--text);color:#111}
.retreat:disabled{opacity:.3;cursor:not-allowed}
/* side */
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:11px 6px;font-family:var(--pix);font-size:12px;position:relative}
.tabs button.on{color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold)}
.tabs .bg{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:var(--danger);color:#fff;font-family:var(--body);font-weight:800;font-size:11px;margin-left:5px;vertical-align:1px}
.pane{padding:14px;display:flex;flex-direction:column;gap:12px}
.sec{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.sec h3{margin:0 0 8px;font-family:var(--pix);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0}
.row .k{color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px 10px;font-size:12px;color:var(--muted);margin-top:8px}
.stats b{color:var(--text);font-variant-numeric:tabular-nums}
.barline{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px}
.barline .n{min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
.tname{font-size:17px;font-weight:700;text-align:center}
.tsub{color:var(--muted);text-align:center;font-size:12px;margin-top:2px}
.segs{display:flex;gap:3px;margin:10px 0 4px;height:16px}
.segs i{flex:1;background:#0e1014;border-radius:3px;border:1px solid #000}
.segs i.f{background:#6aa83b} .segs i.cur{background:linear-gradient(90deg,#6aa83b var(--p),#0e1014 var(--p))}
.segcap{display:flex;justify-content:space-between;font-family:var(--pix);font-size:10px;color:var(--muted)}
.divh{display:flex;align-items:center;gap:8px;margin:12px 0 8px;color:var(--muted);font-family:var(--pix);font-size:10px}
.divh:before,.divh:after{content:"";flex:1;height:1px;background:var(--line)}
.enemies{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.enemy{background:#14161b;border:1px solid var(--line);border-radius:7px;padding:6px 10px;text-align:left;color:var(--text);min-width:110px}
.enemy b{display:block} .enemy span{color:var(--muted);font-size:12px}
.enemy.unk b{color:var(--muted)}
.enemy.el{border-color:#7a3a3a} .enemy.bo{border-color:var(--gold-d)}
.btn{display:block;width:100%;margin-top:12px;padding:10px;border-radius:8px;border:2px solid var(--text);background:transparent;color:var(--text);font-family:var(--pix);font-size:13px;letter-spacing:.5px}
.btn:hover:not(:disabled){background:var(--text);color:#111}
.btn.gold{border-color:var(--gold);color:var(--gold)} .btn.gold:hover:not(:disabled){background:var(--gold);color:#111}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.small{padding:7px;font-size:11px;margin-top:8px}
.note{color:var(--muted);font-size:12px;text-align:center;margin-top:6px;line-height:1.4}
.log{font-size:12px;line-height:1.5;max-height:170px;overflow:auto;color:var(--muted)}
.log div{padding:1px 0;border-bottom:1px solid #2a2e39}
.log .g{color:var(--gold)} .log .r{color:var(--danger)} .log .b{color:var(--time)} .log .v{color:var(--hp)} .log .p{color:var(--xp)}
/* village */
.bld{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start}
.bld .ic{font-size:28px;text-align:center}
.bld .nm{font-weight:700} .bld .lvl{color:var(--gold);font-family:var(--pix);font-size:11px;margin-left:6px}
.bld .ds{color:var(--muted);font-size:12px;margin:2px 0 4px}
.cost{font-size:12px;font-variant-numeric:tabular-nums}
.cost .no{color:var(--danger)}
.bld.lock{opacity:.5}
.mon{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#14161b;margin-bottom:5px;cursor:pointer;color:var(--text);width:100%;text-align:left}
.mon.unk{cursor:default;color:var(--muted)}
.tag{font-size:10px;font-family:var(--pix);padding:2px 5px;border-radius:4px;background:#2c303a;color:var(--muted)}
.tag.k{background:#2b3a2b;color:var(--hp)} .tag.t{background:#3a3220;color:var(--gold)}
.trophies{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.troph{border:1px solid var(--line);border-radius:7px;padding:7px 8px;background:#14161b;font-size:12px}
.troph b{display:block;font-size:12px} .troph span{color:var(--muted)}
.troph.own{border-color:var(--gold-d)} .troph.own span{color:var(--gold)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,6,9,.7);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal[hidden]{display:none}
.mbox{background:#e9e9ea;color:#1b1b1b;border-radius:10px;width:min(400px,100%);padding:18px 20px;position:relative;max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.mbox h2{margin:0;text-align:center;font-size:20px}
.mbox .sub{text-align:center;color:#666;margin-top:2px}
.mbox .x{position:absolute;top:8px;right:12px;background:none;border:0;font-size:20px;color:#999}
.mbox .divh{color:#111}.mbox .divh:before,.mbox .divh:after{background:#c9c9cc}
.mbox .divh span{background:#111;color:#fff;padding:3px 7px;border-radius:4px}
.mbox .row{border-bottom:1px dashed #c9c9cc;padding:6px 2px}
.mbox .row .k{color:#333}
.mbox .row b{font-variant-numeric:tabular-nums}
.mbox .note{color:#555}
.drops{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.drop{width:58px;height:58px;border:1px solid #999;border-radius:6px;background:#d5d5d8;position:relative;display:flex;align-items:center;justify-content:center;font-size:24px}
.drop.uniq{border:2px solid var(--gold-d);background:#efe1b6}
.drop.got{opacity:.45}
.drop small{position:absolute;bottom:0;left:0;right:0;background:#111;color:#fff;font-size:10px;text-align:center;border-radius:0 0 5px 5px;font-family:var(--pix)}
.drop em{position:absolute;top:2px;right:3px;font-style:normal;font-size:10px;font-weight:700;color:#111}
.mbox .btn{border-color:#111;color:#111}.mbox .btn:hover{background:#111;color:#fff}
.gains{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.gains div{background:#d9d9dc;border-radius:6px;padding:7px 9px;font-weight:600}
.gains span{display:block;font-weight:400;color:#555;font-size:12px}
.toasts{position:fixed;top:14px;right:14px;display:flex;flex-direction:column;gap:8px;z-index:30;pointer-events:none}
.toast{background:#22262f;border:1px solid var(--gold-d);border-left:4px solid var(--gold);border-radius:8px;padding:10px 14px;min-width:240px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .3s ease-out}
.toast b{display:block;color:var(--gold);font-family:var(--pix);font-size:11px;font-weight:400;margin-bottom:2px}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
.foot{margin-top:14px;display:flex;justify-content:space-between;color:var(--muted);font-size:12px;flex-wrap:wrap;gap:8px}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="title">Les Boucles du Sablier<small>prototype v0.3 — chemin, vrais combats, compétences, trophées, village</small></div>
    <div class="res" id="res"></div>
    <div class="speed" id="speed"></div>
  </div>
  <div class="timer">
    <span class="lbl" id="loopLbl">⏳ BOUCLE 1</span>
    <div class="bar time"><i id="timeBar"></i></div>
    <span class="val" id="timeVal"></span>
  </div>
  <div class="main">
    <div class="card left">
      <div class="viewtabs" id="viewtabs"></div>
      <div class="view mapview" id="mapView">
        <div class="map" id="map"></div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="view scene" id="sceneView" hidden>
        <div class="sc-head"><div class="sc-title" id="scTitle"></div></div>
        <div class="sc-enemies" id="scEnemies"></div>
        <div class="sc-bottom">
          <div class="unit hero" id="u-hero">
            <div class="por">🧙</div>
            <div class="nm"><b id="heroLv">1</b> Héros</div>
            <div class="bar hp"><i id="heroHpBar"></i><span id="heroHpTxt"></span></div>
            <div class="swing"><i id="heroSwing"></i></div>
          </div>
          <div class="skills" id="scSkills"></div>
        </div>
        <button class="retreat" id="retreatBtn">BATTRE EN RETRAITE</button>
      </div>
    </div>
    <div class="card">
      <div class="tabs" id="tabs"></div>
      <div class="pane" id="pane"></div>
    </div>
  </div>
  <div class="foot">
    <span>Clique une case pour voir sa fiche · double-clic sur une case dorée (ou déjà explorée) pour y aller directement.</span>
    <button id="resetBtn">Réinitialiser la sauvegarde</button>
  </div>
</div>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div class="toasts" id="toasts"></div>

<script>
/*ENGINE_START*/
// ======================= DONNÉES =======================
const BASE_LOOP_TIME = 75;               // secondes d'action par boucle
const HERO_BASE = {hp:40, pow:6, arm:1, dodge:.05, crit:.05, acc:0, speed:.9};
const HERO_PER_LVL = {hp:6, pow:1.2, arm:.4};
const xpNeeded = l => Math.round(10 * Math.pow(l, 1.5));
const REST_RATE = .1;                    // source : 10 % des PV max par seconde

const BIOMES = {
  village:{name:'Village', color:'#e8d6a8'},
  pres:{name:"Prés de l'Aube", color:'#a5d46c', scene:'linear-gradient(180deg,#9fd0e8 0%,#cfe8b0 45%,#7fb556 46%,#5c8f3c 100%)'},
  collines:{name:'Collines grises', color:'#c2ae9b', scene:'linear-gradient(180deg,#8c9bb0 0%,#c8c2b8 45%,#9a8b7b 46%,#6e6257 100%)'},
  puits:{name:'Puits ancien', color:'#676c78'},
};
const TYPES = {
  village:{icon:'🏠', label:'Village'},
  combat:{icon:'⚔️', label:'Exploration'},
  elite:{icon:'💀', label:'Repaire'},
  boss:{icon:'👑', label:'Boss'},
  wood:{icon:'🌳', label:'Récolte'},
  ore:{icon:'⛏️', label:'Filon'},
  spring:{icon:'💧', label:'Source'},
  chest:{icon:'🎁', label:'Trésor'},
  locked:{icon:'🔒', label:'Verrouillé'},
};
const RES = {gold:{icon:'🪙', name:'Or'}, wood:{icon:'🪵', name:'Bois'}, ore:{icon:'🪨', name:'Minerai'}, renown:{icon:'⭐', name:'Renommée'}};

// waves : chaque vague = un groupe d'ennemis combattus en même temps
const TILES = [
  {x:4,y:6,type:'village', biome:'village', name:'Village', lvl:0},
  {x:4,y:7,type:'locked', biome:'puits', name:'Puits ancien', lvl:0},
  // Prés de l'Aube (nord)
  {x:4,y:5,type:'combat', biome:'pres', name:"Lisière de l'Aube", lvl:1, waves:[['mulot'],['mulot'],['mulot','mulot']]},
  {x:4,y:4,type:'combat', biome:'pres', name:'Prairie haute', lvl:2, waves:[['mulot','mulot'],['sanglier'],['mulot','sanglier']]},
  {x:3,y:4,type:'wood',   biome:'pres', name:'Bosquet', lvl:1},

// ======================= MOTEUR =======================
function newMeta(){
  const m = {v:1, loop:1, renown:0, gold:0, wood:0, ore:0, upgrades:{}, discovered:{}, everCompleted:{}, bestiary:{}, chests:{}, trophies:{}, bossKilled:false};
  m.discovered[VILLAGE] = true; neighbors(VILLAGE).forEach(n => m.discovered[n] = true);
  return m;
}
function heroBase(meta){
  const s = {...HERO_BASE, loopTime:BASE_LOOP_TIME};
  for (const k in UPGRADES){ const n = meta.upgrades[k] || 0; if (n) UPGRADES[k].apply(s, n); }
  for (const id in meta.trophies) MONSTERS[id].trophy.apply(s);
  return s;
}
function heroAtLevel(base, lvl){
  return {...base, lvl, maxHp:Math.round(base.hp + HERO_PER_LVL.hp*(lvl-1)),
    pow:base.pow + HERO_PER_LVL.pow*(lvl-1), arm:base.arm + HERO_PER_LVL.arm*(lvl-1)};
}
function skillUnlocked(meta, k){ const u = SKILLS[k].unlock; return !u || (meta.upgrades[u.upg] || 0) >= u.lvl; }
function createGame(meta, rng){
  meta = meta || newMeta(); meta.trophies = meta.trophies || {};
  const G = {meta, rng: rng || Math.random, run:null, events:[]};
  startLoop(G);
  return G;
}
function startLoop(G){
  const base = heroBase(G.meta);
  const hero = heroAtLevel(base, 1); hero.hp = hero.maxHp; hero.xp = 0;
  const skillT = {}; for (const k in SKILLS) skillT[k] = 0;
  G.run = {hero, base, skillT, timeMax:base.loopTime, timeLeft:base.loopTime, completed:new Set([VILLAGE]), heroAt:VILLAGE,
    action:null, over:null, log:[], gains:{renown:0, gold:0, wood:0, ore:0, tiles:0, monsters:0, kills:0, trophies:0}, maxTile:0};
  log(G, `Boucle ${G.meta.loop} : le héros se réveille au village.`, 'b');
}
function log(G, text, cls){ G.run.log.unshift({text, cls}); if (G.run.log.length > 50) G.run.log.pop(); }
function addRes(G, res, n){
  if (!n) return;
  const before = G.meta[res];
  G.meta[res] += n; G.run.gains[res] += n;
  if (res === 'renown') for (const k in UPGRADES){ const q = UPGRADES[k].req; if (before < q && G.meta.renown >= q) G.events.push({type:'unlock', key:k}); }
}
const randInt = (G, a, b) => a + Math.floor(G.rng() * (b - a + 1));

function isExplorable(G, id){
  const t = TILE_MAP[id], r = G.run;
  if (!t || t.type === 'village' || t.type === 'locked' || !G.meta.discovered[id]) return false;
  if (r.completed.has(id)) return true;                          // ré-exploration (farm, ou repos à la source)
  return neighbors(id).some(n => r.completed.has(n));
}
function canExplore(G, id){ return !G.run.over && !G.run.action && isExplorable(G, id); }

function buildSegments(t){
  if (t.waves) return t.waves.map(w => ({kind:'fight', mons:w}));
  switch (t.type){
    case 'wood': case 'ore': return [0,1,2].map(() => ({kind:'harvest', res:t.type, dur:3}));
    case 'spring': return [{kind:'rest', dur:1}];
    case 'chest': return [{kind:'chest', dur:2}];
  }
  return [];
}
function explore(G, id){
  if (!canExplore(G, id)) return false;
  const t = TILE_MAP[id], again = G.run.completed.has(id);
  G.run.action = {id, again, segs:buildSegments(t), seg:-1, phase:'walk', t:0, dur:.5, enemies:null, prevAt:G.run.heroAt};
  G.run.heroAt = id;
  log(G, again ? `Retour à ${t.name} (farm).` : `En route vers ${t.name}.`);
  G.events.push({type:'explore', id});
  return true;
}
function retreat(G){
  const a = G.run.action; if (!a || G.run.over) return;
  if (a.phase === 'rest'){ finishSegment(G); return; }           // « reprendre la route » : la source compte comme faite
  log(G, `Retraite depuis ${TILE_MAP[a.id].name}.`, 'r');
  G.run.heroAt = G.run.completed.has(a.id) ? a.id : a.prevAt;
  G.run.action = null; G.events.push({type:'retreat'});
}
function tick(G, dt){ while (dt > 1e-9){ const s = Math.min(dt, .05); step(G, s); dt -= s; } }
function step(G, dt){
  const r = G.run; if (!r || r.over || !r.action) return;
  r.timeLeft -= dt;
  if (r.timeLeft <= 0){ r.timeLeft = 0; endLoop(G, 'time'); return; }
  const a = r.action;
  if (a.phase === 'fight'){ fightStep(G, dt); return; }
  if (a.phase === 'rest'){                                       // +10 % PV max / s jusqu'à être plein
    const h = r.hero; h.hp = Math.min(h.maxHp, h.hp + REST_RATE * h.maxHp * dt); a.t += dt;
    if (h.hp >= h.maxHp && a.t >= .5) finishSegment(G);
    return;
  }
  a.t += dt;
  if (a.t >= a.dur) finishSegment(G);
}
function finishSegment(G){
  const a = G.run.action, h = G.run.hero;
  if (a.phase === 'harvest'){
    const res = a.segs[a.seg].res, n = randInt(G, 1, 2); addRes(G, res, n);
    log(G, `+${n} ${RES[res].icon} ${RES[res].name.toLowerCase()}`, 'g');
  } else if (a.phase === 'rest'){
    log(G, `Le héros a récupéré : ${Math.round(h.hp)} / ${h.maxHp} PV.`, 'v');
  } else if (a.phase === 'chest'){
    if (!G.meta.chests[a.id]){
      G.meta.chests[a.id] = true; addRes(G, 'gold', 30); addRes(G, 'renown', 5);
      log(G, `Trésor ! +30 🪙 et +5 ⭐ (ne se trouve qu'une fois).`, 'g');
    } else { addRes(G, 'gold', 3); log(G, `L'autel est vide… +3 🪙`, 'g'); }
  }
  nextSegment(G);
}
function nextSegment(G){
  const a = G.run.action, t = TILE_MAP[a.id];
  a.seg++;
  if (a.seg >= a.segs.length){ completeTile(G); return; }
  const s = a.segs[a.seg];
  if (s.kind === 'fight'){
    a.enemies = s.mons.map(id => { const e = monsterStats(id, t.lvl); e.hp = e.maxHp; e.t = -G.rng() * .4; return e; });
    a.heroT = 0; a.phase = 'fight';
    for (const e of a.enemies){
      const b = G.meta.bestiary[e.id] || (G.meta.bestiary[e.id] = {seen:false, killed:false});
      if (!b.seen){ b.seen = true; G.run.gains.monsters++; log(G, `Nouvelle fiche au bestiaire : ${e.name}.`, 'p'); }
    }
    log(G, `Vague ${a.seg + 1} : ${a.enemies.map(e => e.name).join(', ')}.`, 'r');
  } else {
    a.phase = s.kind; a.t = 0; a.dur = s.dur; a.enemies = null;
    if (s.kind === 'rest') log(G, 'Le héros se repose à la source…', 'v');
  }
}
function strike(G, src, att, tgtKey, def, mult, sure){
  const hitChance = Math.max(.1, Math.min(.98, .85 + att.acc - def.dodge));
  if (!sure && G.rng() >= hitChance){ G.events.push({type:'miss', src, tgt:tgtKey}); return; }
  const crit = G.rng() < att.crit;
  const dmg = Math.max(1, Math.round((att.pow * mult - def.arm) * (crit ? 1.5 : 1)));
  def.hp -= dmg; G.events.push({type:'hit', src, tgt:tgtKey, dmg, crit, skill:mult !== 1});
}
const firstAlive = a => a.enemies.findIndex(e => e.hp > 0);
function fightStep(G, dt){
  const r = G.run, a = r.action, h = r.hero;
  // attaque de base
  a.heroT += dt;
  while (a.heroT >= h.speed){
    a.heroT -= h.speed; const i = firstAlive(a); if (i < 0) break;
    strike(G, 'hero', h, 'e' + i, a.enemies[i], 1, false);
    if (resolveDeaths(G)) return;
  }
  // compétences automatiques
  for (const k in SKILLS){
    if (!skillUnlocked(G.meta, k)) continue;
    r.skillT[k] = Math.min(SKILLS[k].cd, r.skillT[k] + dt);
    if (r.skillT[k] < SKILLS[k].cd) continue;
    if (k === 'souffle' && h.hp > h.maxHp * .5) continue;     // attend d'être sous 50 %
    r.skillT[k] = 0; G.events.push({type:'skill', key:k});
    if (k === 'coup'){ const i = firstAlive(a); if (i >= 0) strike(G, 'hero', h, 'e' + i, a.enemies[i], 2.5, true); }
    else if (k === 'tourbillon') a.enemies.forEach((e, i) => { if (e.hp > 0) strike(G, 'hero', h, 'e' + i, e, 1.2, true); });
    else if (k === 'souffle'){ const n = Math.round(h.maxHp * .25); h.hp = Math.min(h.maxHp, h.hp + n); G.events.push({type:'heal', tgt:'hero', n}); }
    if (resolveDeaths(G)) return;
  }
  // ennemis
  for (let i = 0; i < a.enemies.length; i++){
    const e = a.enemies[i]; if (e.hp <= 0) continue;
    e.t += dt;
    while (e.t >= e.speed){
      e.t -= e.speed; strike(G, 'e' + i, e, 'hero', h, 1, false);
      if (h.hp <= 0){ h.hp = 0; endLoop(G, 'death', e.name); return; }
    }
  }
}
function resolveDeaths(G){
  const a = G.run.action;
  a.enemies.forEach((e, i) => { if (e.hp <= 0 && !e.dead){ e.dead = true; e.hp = 0; onKill(G, e, i); } });
  if (a.enemies.every(e => e.dead)){
    const h = G.run.hero, n = Math.round(h.maxHp * .1);
    h.hp = Math.min(h.maxHp, h.hp + n);                       // souffle entre deux vagues
    a.enemies = null; nextSegment(G); return true;
  }
  return false;
}
function onKill(G, e, i){
  const h = G.run.hero, m = MONSTERS[e.id], rk = RANK[e.rank];
  G.run.gains.kills++;
  const xp = 4 * e.lvl * rk.xp; h.xp += xp;
  let msg = `${e.name} vaincu : +${xp} XP`;
  for (const d of m.drops){ if (G.rng() < d.chance){ const n = randInt(G, d.min, d.max); addRes(G, d.res, n); msg += `, +${n} ${RES[d.res].icon}`; } }
  log(G, msg, 'g');
  G.events.push({type:'kill', tgt:'e' + i});
  const b = G.meta.bestiary[e.id];
  if (!b.killed){ b.killed = true; addRes(G, 'renown', rk.renown); log(G, `Première victoire contre ${e.name} : +${rk.renown} ⭐`, 'g'); }
  if (!G.meta.trophies[e.id] && G.rng() < m.trophy.chance){
    G.meta.trophies[e.id] = true; G.run.gains.trophies++;
    log(G, `🏆 Trophée unique : ${m.trophy.name} (${m.trophy.desc}, permanent).`, 'g');
    G.events.push({type:'trophy', id:e.id});
  }
  while (h.xp >= xpNeeded(h.lvl)){
    h.xp -= xpNeeded(h.lvl);
    const nh = heroAtLevel(G.run.base, h.lvl + 1), gain = nh.maxHp - h.maxHp;
    Object.assign(h, {lvl:nh.lvl, maxHp:nh.maxHp, pow:nh.pow, arm:nh.arm}); h.hp += gain;
    log(G, `Niveau ${h.lvl} !`, 'p'); G.events.push({type:'level', lvl:h.lvl});
  }
  if (e.rank === 'boss' && !G.meta.bossKilled){ G.meta.bossKilled = true; G.events.push({type:'boss'}); }
}
function completeTile(G){
  const a = G.run.action, id = a.id, t = TILE_MAP[id];
  G.run.completed.add(id); G.run.action = null; G.run.maxTile = Math.max(G.run.maxTile, t.lvl);
  if (!G.meta.everCompleted[id]){
    G.meta.everCompleted[id] = true; addRes(G, 'renown', 3 * t.lvl);
    log(G, `${t.name} explorée pour la première fois : +${3*t.lvl} ⭐`, 'g');
  } else log(G, `${t.name} explorée.`, 'v');
  neighbors(id).forEach(n => { if (!G.meta.discovered[n]){ G.meta.discovered[n] = true; G.run.gains.tiles++; } });
  G.events.push({type:'tileDone', id});
}
function endLoop(G, reason, enemyName){
  const r = G.run; if (r.over) return;
  r.over = {reason, enemyName, loop:G.meta.loop, lvl:r.hero.lvl, gains:{...r.gains}, tilesDone:r.completed.size - 1};
  r.action = null;
  G.events.push({type:'loopEnd'});
}
function newLoop(G){ G.meta.loop++; startLoop(G); }
function abandon(G){ if (!G.run.over) endLoop(G, 'return'); }
function canAfford(meta, cost){ return Object.keys(cost).every(k => meta[k] >= cost[k]); }
function upgradeState(G, key){
  const u = UPGRADES[key], n = G.meta.upgrades[key] || 0, cost = u.cost(n);
  return {u, n, cost, unlocked:G.meta.renown >= u.req, maxed:n >= u.max,
    ok:G.meta.renown >= u.req && n < u.max && canAfford(G.meta, cost)};
}
function buy(G, key){
  const s = upgradeState(G, key); if (!s.ok) return false;
  for (const k in s.cost) G.meta[k] -= s.cost[k];
  G.meta.upgrades[key] = s.n + 1;
  return true;
}

function tileProgress(a){

function segFill(a){

  return a.dur ? Math.min(1, a.t / a.dur) : 0;
}

    : `<div class="note">Bats-le une fois pour révéler ses butins.</div>`;
  $('mbox').innerHTML = `<button class="x" data-close>×</button><div style="text-align:center;font-size:48px">${seen ? mm.por : '❔'}</div><h2>${seen ? mm.name : '???'}</h2><div class="sub">${RANK[mm.rank].label} · Niveau ${L}</div>
    <div class="divh"><span>STATS</span></div>${rows.map(([k,v]) => `<div class="row"><span class="k">${k}</span><b>${v}</b></div>`).join('')}
    ${seen ? '' : '<div class="note">Rencontre-le une fois pour révéler sa fiche.</div>'}
    <div class="divh"><span>BUTINS</span></div>${drops}`;
  modalMode = 'monster'; $('modal').hidden = false;
}
function openLoopEnd(){
  const o = G.run.over, g = o.gains;
  const why = {death:`Le héros est tombé face à <b>${o.enemyName}</b>.`, time:'Le sablier s\'est vidé.', return:'Le héros est rentré au village.'}[o.reason];
  $('mbox').innerHTML = `<h2>⏳ La boucle se referme</h2><div class="sub">Boucle ${o.loop} · ${why}</div>
    <div class="divh"><span>CE QUE TU AS FAIT</span></div>
    <div class="row"><span class="k">Niveau atteint</span><b>${o.lvl}</b></div>
    <div class="row"><span class="k">Cases explorées</span><b>${o.tilesDone}</b></div>
    <div class="row"><span class="k">Monstres vaincus</span><b>${g.kills}</b></div>
    <div class="divh"><span>CE QUE LE VILLAGE RETIENT</span></div>
    <div class="gains">
      <div>⭐ +${g.renown}<span>Renommée</span></div><div>🪙 +${g.gold}<span>Or</span></div>
      <div>🪵 +${g.wood} · 🪨 +${g.ore}<span>Matériaux</span></div><div>🗺️ +${g.tiles} · 📖 +${g.monsters} · 🏆 +${g.trophies}<span>Cases · fiches · trophées</span></div>
    </div>
    <div class="note">Le héros oublie son niveau. Toi, tu gardes la carte, le bestiaire, les trophées et le village.</div>
    ${anyUpgrade() ? '<button class="btn" data-newloop data-go="village">❗ AMÉLIORER LE VILLAGE D\'ABORD</button><button class="btn small" data-newloop>NOUVELLE BOUCLE ⟳</button>'
      : '<button class="btn" data-newloop>NOUVELLE BOUCLE ⟳</button>'}`;
  modalMode = 'loop'; $('modal').hidden = false;
}
function openBoss(){
  $('mbox').innerHTML = `<div style="text-align:center;font-size:52px">🗽</div><h2>Le Gardien du Sablier est tombé</h2><div class="sub">Fin du contenu du prototype</div>
    <div class="note" style="margin:14px 0">Le sablier se fissure… La suite (la mine, la forge à recettes, les autres époques) arrivera dans les prochaines versions. Tu peux continuer à boucler pour compléter tes trophées.</div>
    <button class="btn" data-close>CONTINUER</button>`;
  modalMode = 'boss'; $('modal').hidden = false;
}
$('modal').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (e.target.id === 'modal' && modalMode !== 'loop'){ closeModal(); return; }
  if (!b) return;
  if (b.hasAttribute('data-newloop')){ newLoop(G); saveMeta(); tab = b.dataset.go ? 'village' : 'explore'; view = 'map'; lastSceneTile = null; closeModal(); }
  else if (b.hasAttribute('data-close')) closeModal();
});
function closeModal(){ $('modal').hidden = true; modalMode = null; if (G.run.over) openLoopEnd(); render(); }

$('resetBtn').addEventListener('click', () => {
  if (!resetArm){ resetArm = true; $('resetBtn').textContent = 'Clique encore pour tout effacer'; setTimeout(() => { resetArm = false; $('resetBtn').textContent = 'Réinitialiser la sauvegarde'; }, 3000); return; }
  try { localStorage.removeItem(SAVE_KEY); } catch(e){}
  G = createGame(null); resetArm = false; $('resetBtn').textContent = 'Réinitialiser la sauvegarde'; selected = TILES[2].id; view = 'map'; lastSceneTile = null; closeModal();
});

// ---------- événements & boucle principale ----------
function consumeEvents(){
  const fx = view === 'scene';
  for (const ev of G.events){
    if (ev.type === 'hit' && fx){
      floatNum(ev.tgt, '-' + ev.dmg + (ev.crit ? '!' : ''), ev.crit ? 'f-crit' : ev.skill ? 'f-sk' : '');
      anim(unitEl(ev.src), ev.src === 'hero' ? 'atk-u' : 'atk-d'); anim(unitEl(ev.tgt), 'shake');
    }
    else if (ev.type === 'miss' && fx) floatNum(ev.tgt, ev.tgt === 'hero' ? 'esquive' : 'raté', 'f-miss');
    else if (ev.type === 'heal' && fx) floatNum(ev.tgt, '+' + ev.n, 'f-heal');
    else if (ev.type === 'skill' && fx) anim($('sk-' + ev.key), 'fire');
    else if (ev.type === 'explore'){ clearTimeout(backTimer); lastSceneTile = ev.id; view = 'scene'; }
    else if (ev.type === 'tileDone' || ev.type === 'retreat'){ clearTimeout(backTimer); backTimer = setTimeout(() => { if (!G.run.action){ view = 'map'; render(); } }, 900); }
    else if (ev.type === 'level' && fx) floatNum('hero', 'NIVEAU ' + ev.lvl, 'f-lv');
    else if (ev.type === 'trophy'){ const tr = MONSTERS[ev.id].trophy; toast('🏆 TROPHÉE UNIQUE', `${tr.icon} ${tr.name} — ${tr.desc} (permanent)`); saveMeta(); }
    else if (ev.type === 'unlock'){ const u = UPGRADES[ev.key]; toast('❗ NOUVEAU BÂTIMENT', `${u.icon} ${u.name} est disponible au village.`); }
    else if (ev.type === 'loopEnd'){ saveMeta(); if (modalMode !== 'boss') openLoopEnd(); }
    else if (ev.type === 'boss'){ saveMeta(); openBoss(); }
  }
  G.events.length = 0;
}
function render(){ renderTop(); renderTabs(); renderMap(); if (view === 'scene') renderScene(); renderPane(); }
let last = performance.now(), saveT = 0;
setInterval(() => {
  const now = performance.now(), dt = Math.min(1, (now - last) / 1000); last = now;
  if (!modalMode) tick(G, dt * gameSpeed);
  consumeEvents();
  saveT += dt; if (saveT > 5){ saveT = 0; saveMeta(); }
  render();
}, 50);
render();
</script>
</body>
</html>
